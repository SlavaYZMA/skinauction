<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skin Auction</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="People in Berlin offer a piece of their own skin. You write a price. The highest price on 6 December 2026, 20:00 CET, decides what is tattooed there. Forever.">
<meta property="og:title" content="Skin Auction"><meta property="og:description" content="Write a price under a piece of skin. Bidding 30 Nov – 6 Dec 2026, worldwide."><meta property="og:image" content="https://skinauction.org/assets/lots/02.jpg">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
/* Layout: follows the artist's sketch. Entry gives a paddle number first; then a small grid of skin photographs on white, a green price under each, details behind an eye icon, live bid terminal at the bottom. */
:root{
  color-scheme:light;
  --bg:#fff;--ink:#222;--muted:#a3a3a3;--green:#2fd65f;--green-d:#1fae49;--ph:#f2f1ee;--red:#e0483c;--line:#eee;
  --f:"Open Sans","Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  padding-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}

.bar{position:relative;z-index:5;display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 10px max(24px,env(safe-area-inset-left,0px));font-size:13px;color:var(--muted)}
.bar button{background:none;border:0;padding:0;color:var(--muted);cursor:pointer}
.bar button[aria-pressed="true"]{color:var(--ink)}
.bar .l{display:flex;gap:10px;align-items:baseline}
.bar b{color:var(--green);font-weight:500}

.page{padding-block:28px 170px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.grid{display:grid;grid-template-columns:repeat(3,260px);gap:56px 18px;margin-left:clamp(0px,14vw,194px)}
@media (max-width:920px){.grid{grid-template-columns:repeat(2,minmax(0,260px));margin-left:0}}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:34px 12px}}
.lot{min-width:0}
.ph{position:relative;display:block;width:100%;border:0;padding:0;aspect-ratio:260/170;max-width:100%;background:var(--ph) center/cover;cursor:pointer}
.ph .none{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:#c8c6c1}
.eye{position:absolute;right:8px;bottom:7px;width:18px;height:18px;opacity:.85;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45));transition:opacity .2s}
.ph:hover .eye,.ph[aria-expanded="true"] .eye{opacity:1}
.p{display:block;background:none;border:0;padding:0;margin-top:2px;font-size:18px;line-height:1.5;color:var(--green);cursor:text;font-variant-numeric:tabular-nums;text-align:left}
.p:hover{color:var(--green-d)}
.p[disabled]{color:var(--muted);cursor:default}
.p .lead{font-size:11px;color:var(--green-d);margin-left:8px;vertical-align:2px}
.edit{display:flex;align-items:baseline;font-size:18px;line-height:1.5;color:var(--green);margin-top:2px}
.edit input{border:0;border-bottom:1px solid var(--green);width:5ch;padding:0;background:none;outline:none;color:var(--green);font-size:18px;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.edit input::-webkit-outer-spin-button,.edit input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
@media (max-width:560px){.p,.edit,.edit input{font-size:16px}}
.d{font-size:12px;line-height:1.55;color:var(--muted);padding-top:4px}
.d b{color:var(--ink);font-weight:400}
.d q{display:block;color:var(--ink);font-style:italic;margin:4px 0}
.d .v{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:zoom-in;font-size:12px}
.acts{display:flex;gap:14px;font-size:12px;margin-top:3px}
.acts button{background:none;border:0;padding:0;cursor:pointer;color:var(--green-d)}
.acts button.a2{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.m{font-size:12px;color:var(--muted);min-height:16px}
.m.err{color:var(--red)}
.flash .p{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(1.1);transform-origin:left}100%{transform:scale(1)}}

/* terminal */
.term{position:fixed;left:0;right:0;bottom:0;z-index:4;background:rgba(255,255,255,.96);border-top:1px solid var(--line);font-family:var(--mono);font-size:12px;line-height:18px;color:var(--muted);padding:8px max(24px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));cursor:pointer}
.term .ls{height:90px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;margin-left:clamp(0px,14vw,194px)}
@media (max-width:920px){.term .ls{margin-left:0}}
.term.big .ls{height:min(50vh,360px);overflow:auto;justify-content:flex-start}
.term .l{height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none;font-variant-numeric:tabular-nums}
.term .l b{color:var(--ink);font-weight:400}.term .l i{font-style:normal;color:var(--green)}
.term .l.me b{color:var(--green-d)}
.term .l.new{animation:nl .8s ease-out}
@keyframes nl{from{background:#e9fbef}to{background:transparent}}
body.typing .term{display:none}

/* entry + info */
.door{position:fixed;inset:0;z-index:10;background:var(--bg);overflow:auto;padding:max(72px,10vh) max(24px,env(safe-area-inset-right,0px)) 40px max(24px,env(safe-area-inset-left,0px))}
.door .in{max-width:360px;margin-left:clamp(0px,14vw,194px);display:grid;gap:14px}
.door h1{font-weight:400;font-size:26px;margin:0 0 4px}
.door p,.door li{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.door ul{margin:0;padding-left:16px;display:grid;gap:2px}
.door p b,.door li b{color:var(--ink);font-weight:400}
.door input[type=text]{border:0;border-bottom:1px solid #d6d6d6;padding:8px 0;font-size:15px;background:none;outline:none;width:100%;border-radius:0}
.door input[type=text]:focus{border-color:var(--ink)}
.door .ck{display:flex;gap:8px;font-size:12.5px;color:var(--muted);line-height:1.5;align-items:flex-start}
.door .ck input{margin-top:3px;accent-color:var(--green)}
.door .go{justify-self:start;background:none;border:0;padding:0;font-size:22px;color:var(--green);cursor:pointer}
.door .go:hover{color:var(--green-d)}
.door .look{justify-self:start;background:none;border:0;padding:0;font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.door .big{font-size:64px;line-height:1;color:var(--green);font-variant-numeric:tabular-nums}
.door .lang{display:flex;gap:10px;font-size:13px}
.door .lang button{background:none;border:0;padding:0;color:var(--muted);cursor:pointer}
.door .lang button[aria-pressed="true"]{color:var(--ink)}
.door h2{font-weight:400;font-size:15px;margin:10px 0 0;color:var(--ink)}
.door .small{font-size:12px}
.door a{text-underline-offset:3px}
.lb{position:fixed;inset:0;z-index:12;background:#fff;display:grid;place-items:center;cursor:zoom-out;padding:24px 24px 56px}
.lb img{max-width:min(100%,1100px);max-height:calc(100vh - 100px);object-fit:contain;min-width:0;min-height:0}
.lb p{position:absolute;left:24px;bottom:18px;margin:0;font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;z-index:6;background:var(--ink);color:#fff;font-size:13px;padding:9px 14px;max-width:min(520px,90vw);text-align:center}
@media (prefers-reduced-motion:reduce){.flash .p,.term .l.new{animation:none}}
</style>
</head><body>

<div class="bar"><div class="l"><button type="button" data-lang="en">EN</button><button type="button" data-lang="de">DE</button><button type="button" id="infob">?</button></div><div id="num"></div></div>
<main class="page"><div class="grid" id="grid"></div></main>
<section class="term" id="term" aria-label="Live bids" aria-live="polite"><div class="ls" id="ls"></div></section>
<div class="door" id="door" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="lb" id="lb" hidden><img id="lbi" alt=""><p id="lbp"></p></div>
<datalist id="cc"></datalist>

</form>

<script>

/* ---------- words ---------- */

 en:{

};
let L=S.get("lang")||((navigator.language||"").toLowerCase().startsWith("de")?"de":"en");
const W=()=>T[L];
const eur=v=>{const s=Number(v).toLocaleString(L==="de"?"de-DE":"en-US");return L==="de"?`${s} €`:`€${s}`};
const ARTIST={handle:"@iconicyzma",url:"https://instagram.com/iconicyzma"};

/* ---------- countries (ISO codes, names in the page language) ---------- */
const CC="AD AE AF AG AL AM AO AR AT AU AZ BA BB BD BE BF BG BH BI BJ BN BO BR BS BT BW BY BZ CA CD CF CG CH CI CL CM CN CO CR CU CV CY CZ DE DJ DK DM DO DZ EC EE EG ER ES ET FI FJ FR GA GB GD GE GH GM GN GQ GR GT GW GY HK HN HR HT HU ID IE IL IN IQ IR IS IT JM JO JP KE KG KH KM KN KR KW KZ LA LB LC LI LK LR LS LT LU LV LY MA MC MD ME MG MK ML MM MN MO MR MT MU MV MW MX MY MZ NA NE NG NI NL NO NP NZ OM PA PE PG PH PK PL PR PS PT PY QA RO RS RU RW SA SB SC SD SE SG SI SK SL SM SN SO SR SS ST SV SY SZ TD TG TH TJ TL TM TN TO TR TT TW TZ UA UG US UY UZ VA VC VE VN VU WS XK YE ZA ZM ZW".split(" ");
const ccName=(c,lang=L)=>{try{return new Intl.DisplayNames([lang],{type:"region"}).of(c)||c}catch(e){return c}};
const toCC=v=>{v=v.trim();if(/^[a-z]{2}$/i.test(v))return v.toUpperCase();const k=v.toLowerCase();for(const c of CC)if(ccName(c).toLowerCase()===k||ccName(c,"en").toLowerCase()===k||ccName(c,"de").toLowerCase()===k)return c;return v};
const myCC=()=>{const m=(navigator.language||"").match(/-([A-Z]{2})$/i);return m&&CC.includes(m[1].toUpperCase())?m[1].toUpperCase():""};
function fillCC(){$("cc").innerHTML=CC.map(c=>`<option value="${esc(ccName(c))}">`).join("")}

/* ---------- close time in the visitor's own time, and a calendar file ---------- */
function localT(ts){const o={hour:"2-digit",minute:"2-digit"},d=new Date(ts);const mine=d.toLocaleString(L==="de"?"de-DE":"en-GB",{...o,weekday:"short"}),ber=d.toLocaleString(L==="de"?"de-DE":"en-GB",{...o,weekday:"short",timeZone:"Europe/Berlin"});return mine===ber?"":mine}
function ics(){const f=d=>new Date(d).toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const s=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//skinauction.org//EN","BEGIN:VEVENT","UID:close-2026@skinauction.org","DTSTAMP:"+f(Date.now()),"DTSTART:"+f(ST.close-30*60000),"DTEND:"+f(ST.close),"SUMMARY:Skin Auction closes","URL:https://skinauction.org","DESCRIPTION:Last 30 minutes. A price in the last 2 minutes of a lot adds 2 minutes.","BEGIN:VALARM","TRIGGER:-PT15M","ACTION:DISPLAY","DESCRIPTION:Skin Auction closes soon","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  return "data:text/calendar;charset=utf-8,"+encodeURIComponent(s)}
const calLink=()=>`<a class="small" href="${ics()}" download="skin-auction.ics">${W().cal}</a>`;
const privLine=()=>`<p class="small">${W().private} <a href="${ARTIST.url}" target="_blank" rel="noopener">${ARTIST.handle}</a></p>`;
const legal=()=>`<p class="small"><a href="/impressum.html">Impressum</a> · <a href="/datenschutz.html">${L==="de"?"Datenschutz":"Privacy"}</a></p>`;

/* ---------- state ---------- */
let LOTS=[];
let ST={open:Date.parse("2026-11-30T00:00:00+01:00"),close:Date.parse("2026-12-06T20:00:00+01:00"),skew:0,online:false,regs:[],bidders:0,countries:0};
const now=()=>Date.now()+ST.skew;
const lotClose=l=>l.close||ST.close;
const phase=l=>now()<ST.open?"pre":now()>(l?lotClose(l):Math.max(ST.close,...LOTS.map(lotClose)))?"closed":"open";
const step=v=>Math.max(10,Math.ceil(v*0.05/5)*5);
const topBid=l=>l.bids.length?l.bids[0].v:(l.start||0),minBid=l=>l.bids.length?topBid(l)+step(topBid(l)):(l.start||0);
let ME=null;try{ME=JSON.parse(S.get("bidder")||"null")}catch(e){}
let looking=S.get("looking")==="1",editing=null,confirmBig=null,openSet=new Set(),leadPrev={};
const t2=(n)=>String(n).padStart(2,"0");
const hms=t=>{const d=new Date(t);return `${t2(d.getHours())}:${t2(d.getMinutes())}:${t2(d.getSeconds())}`};
const left=ms=>{let s=Math.max(0,ms/1000|0);const d=s/86400|0;s%=86400;return (d?d+"d ":"")+`${t2(s/3600|0)}:${t2((s%3600)/60|0)}:${t2(s%60)}`};
const txt=(l,k)=>(l[L]&&l[L][k])||(l.en&&l.en[k])||l[k]||"";
const EYE=`<svg class="eye" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>`;

/* ---------- bar ---------- */
function bar(){document.documentElement.lang=L;document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===L)));
  const leads=ME&&ME.num?LOTS.filter(l=>l.bids[0]&&l.bids[0].num===ME.num).length:0;
  $("num").innerHTML=ME&&ME.num?`${leads?W().leadOn(leads)+" · ":""}# <b>${ME.num}</b> <button type="button" id="forget">${W().notYou}</button>`:"";
  if(ME&&ME.num)$("forget").onclick=()=>{S.del("bidder");ME=null;looking=false;door();render()}}
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{L=b.dataset.lang;S.set("lang",L);render();term();if(!$("door").hidden)door(true)});
$("infob").onclick=()=>info();
$("lb").onclick=()=>{$("lb").hidden=true};
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("lb").hidden=true});

/* ---------- entry ---------- */
function langSw(){return `<div class="lang"><button type="button" data-l="en" aria-pressed="${L==="en"}">EN</button><button type="button" data-l="de" aria-pressed="${L==="de"}">DE</button></div>`}
function wireLang(again){$("door").querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{L=b.dataset.l;S.set("lang",L);again();render();term()})}
function door(force){const d=$("door"),w=W();
  if(!force&&(ME&&ME.num||looking)){d.hidden=true;return}
  d.hidden=false;fillCC();d.innerHTML=`<form class="in" id="f" novalidate>${langSw()}<h1>${w.title}</h1>
  <p>${w.intro}</p>${LOTS.length?`<p>${w.once1(LOTS.length)}</p>`:""}<ul>${w.trust.map(x=>`<li>${x}</li>`).join("")}</ul><p>${w.anchor}</p><p><b>${w.once}</b></p>
  <input type="text" id="nick" placeholder="${w.name}" maxlength="40" autocomplete="nickname">
  <input type="text" id="country" placeholder="${w.country}" maxlength="40" list="cc" autocomplete="off" value="${esc(myCC()?ccName(myCC()):"")}">
  <input type="text" id="contact" placeholder="${w.contact}" maxlength="80" autocomplete="email">
  <label class="ck" for="c21"><input type="checkbox" id="c21"> ${w.c21}</label>
  <label class="ck" for="crules"><input type="checkbox" id="crules"> ${w.rules}</label>
  <input type="text" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
  <div class="m" id="dm"></div><button type="submit" class="go">${w.enter}</button><button type="button" class="look" id="look">${w.look}</button>
  ${privLine()}<p class="small"><a href="about.html">${w.about}</a></p>${legal()}</form>`;
  wireLang(()=>door(true));
  $("look").onclick=()=>{looking=true;S.set("looking","1");d.hidden=true;render()};
  $("f").onsubmit=e=>{e.preventDefault();const nick=$("nick").value.trim(),country=toCC($("country").value),contact=$("contact").value.trim(),m=$("dm");
    if(!nick||!contact){m.className="m err";m.textContent=w.needName;return}
    if(!$("c21").checked||!$("crules").checked){m.className="m err";m.textContent=w.needCk;return}
    post("/api/register",{name:nick,country,contact,age_21:"yes",rules:"yes","bot-field":$("hp").value}).then(r=>done(r.num)).catch(x=>{if(x.offline)done(100+Math.floor(Math.random()*900));else{m.className="m err";m.textContent=x.message}});
    function done(num){ME={nick,country,contact,num};S.set("bidder",JSON.stringify(ME));S.del("looking");looking=false;if(!ST.online)ST.regs.push({num,t:Date.now()});
      copy({lot:"",bid_eur:"",name:nick,country,contact,age_21:"yes",rules:"yes",paddle:String(num),kind:"register"});
      d.innerHTML=`<div class="in"><p>${W().yourNum}</p><div class="big">${num}</div><p>${W().howTo}</p><p>${W().closesAt(localT(ST.close))}</p>${calLink()}<button type="button" class="go" id="cont">${W().cont}</button></div>`;
      $("cont").onclick=()=>{d.hidden=true;render();term()};$("cont").focus()}}}
function info(){const d=$("door"),w=W();d.hidden=false;
  d.innerHTML=`<div class="in">${langSw()}<h1>${w.title}</h1><p>${w.intro}</p><ul>${w.trust.map(x=>`<li>${x}</li>`).join("")}</ul>
  <h2>${w.winTitle}</h2><ul>${w.win.map(x=>`<li>${x}</li>`).join("")}</ul>
  <h2>${w.rulesTitle}</h2><ul>${w.rulesList.map(x=>`<li>${x}</li>`).join("")}</ul>
  <p>${w.closesAt(localT(ST.close))}</p>${calLink()}
  <p>${w.anchor}</p>${privLine()}<p><a href="about.html">${w.about}</a></p>${legal()}<button type="button" class="go" id="cl">${w.close}</button></div>`;
  wireLang(info);$("cl").onclick=()=>{d.hidden=true;door()};$("cl").focus()}

/* ---------- grid ---------- */
function lotHTML(l){const w=W(),mine=ME&&l.bids[0]&&l.bids[0].num===ME.num,has=l.start||l.bids.length,ph=phase(l);
  let price;
  const ceil=mine&&ME.ceil&&ME.ceil[l.no]>topBid(l)?ME.ceil[l.no]:0;
  if(editing===l.no)price=`<div class="edit">${L==="de"?"":"€"}<input id="in${l.no}" type="number" inputmode="numeric" min="${minBid(l)}" value="${confirmBig&&confirmBig.no===l.no?confirmBig.v:minBid(l)}" aria-label="lot ${l.no}">${L==="de"?" €":""}</div>
    <div class="acts"><button type="button" class="a1" data-act="bid">${w.bidBtn}</button><button type="button" class="a2" data-act="max" title="${esc(w.maxHint)}">${w.maxBtn}</button></div>`;
  else if(has)price=`<button type="button" class="p" data-no="${l.no}" ${ph==="closed"?"disabled":""}>${eur(topBid(l))}${mine?`<span class="lead">${w.lead}${ceil?` · ${w.upTo(ceil)}`:""}</span>`:""}</button>`;
  else price=`<div class="p" style="color:var(--muted);font-size:13px;line-height:27px">${w.tba}</div>`;
  const open=openSet.has(l.no);
  const ext=l.close&&l.close>ST.close?`<br>${w.ext(hms(l.close).slice(0,5))}`:"";
  const est=l.est&&l.est.length===2?`<br>${w.est}: ${eur(l.est[0])}–${eur(l.est[1]).replace(/^€/,"")}`:"";
  const det=open?`<div class="d">${w.lotL} ${l.no} · <b>${esc(txt(l,"part"))}</b> · ${esc(txt(l,"size"))}<br>${w.oneOf}<br>${w.notAllowed}: ${esc(txt(l,"off"))}${l.seller?`<br>${w.seller}: ${esc(l.seller)}`:""}${est}${l.quote?`<q>${esc(l.quote)}</q>`:""}${l.bids.length?`<br>${w.highest} #${l.bids[0].num} · ${w.prices(l.count)}${l.bidders>1?` · ${w.bidders(l.bidders)}`:""}`:""}${ext}${l.img?`<br><button type="button" class="v" data-lb="${l.no}">${w.view}</button>`:""}</div>`:"";
  return `<div class="lot" id="lot-${l.no}"><button type="button" class="ph" data-ph="${l.no}" aria-expanded="${open}" aria-label="lot ${l.no}: ${esc(txt(l,"part"))}" style="${l.img?`background-image:url(${l.img})`:""}">${l.img?"":`<span class="none">${w.soon}</span>`}${EYE}</button>${price}${det}<div class="m" id="m${l.no}"></div></div>`}
function render(){if(!editing)document.body.classList.remove("typing");bar();
  $("grid").innerHTML=LOTS.map(lotHTML).join("");
  document.querySelectorAll("[data-ph]").forEach(p=>p.onclick=()=>{const n=p.dataset.ph;openSet.has(n)?openSet.delete(n):openSet.add(n);render()});
  document.querySelectorAll("[data-lb]").forEach(b=>b.onclick=()=>{const l=LOTS.find(x=>x.no===b.dataset.lb);$("lbi").src=l.img;$("lbi").alt=txt(l,"part");$("lbp").textContent=`${W().lotL} ${l.no} · ${txt(l,"part")} · ${txt(l,"size")}`;$("lb").hidden=false});
  document.querySelectorAll(".p[data-no]").forEach(b=>b.onclick=()=>{
    if(!ME||!ME.num){looking=false;S.del("looking");door(true);return}
    editing=b.dataset.no;confirmBig=null;render();focusEdit()});
  if(editing)focusEdit(true)}
function focusEdit(silent){const i=$("in"+editing);if(!i)return;document.body.classList.add("typing");if(!silent){i.focus();i.select();setTimeout(()=>i.scrollIntoView({block:"center",behavior:"smooth"}),300)}
  i.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();submit(editing,+i.value)}if(e.key==="Escape"){editing=null;confirmBig=null;render()}};
  if(!silent)say(editing,W().maxHint);
  document.querySelectorAll(".acts button").forEach(b=>{b.onpointerdown=e=>e.preventDefault();b.onmousedown=e=>e.preventDefault();
    b.onclick=()=>submit(editing,+i.value,b.dataset.act==="max")});
  i.onblur=()=>setTimeout(()=>{if(editing&&document.activeElement!==i){editing=null;confirmBig=null;render()}},200)}
function say(no,t,err){const m=$("m"+no);if(m){m.textContent=t;m.className="m"+(err?" err":"")}}
function toast(t){const x=$("toast");x.textContent=t;x.hidden=false;clearTimeout(x._t);x._t=setTimeout(()=>x.hidden=true,5000)}

/* ---------- actions ---------- */
function post(url,body){return fetch(url,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)}).then(async r=>{const d=await r.json().catch(()=>null);if(!d)throw Object.assign(new Error("offline"),{offline:1});if(!r.ok||d.error)throw Object.assign(new Error(d.error),{min:d.min});return d})}
function copy(o){fetch("/",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({"form-name":"bid",...o}).toString()}).catch(()=>{})}
function submit(no,v,asMax){const l=LOTS.find(x=>x.no===no),mn=minBid(l),w=W();v=Math.round(v);
  if(!(v>=mn))return say(no,w.atLeast(mn),1);
  if(v>=mn*3&&v-mn>=300&&!(confirmBig&&confirmBig.no===no&&confirmBig.v===v)){confirmBig={no,v};return say(no,w.big(v))}
  confirmBig=null;place(l,v,!!asMax)}
function place(l,v,asMax){const w=W(),no=l.no;
  const ok=d=>{l.bids=d.bids;l.count=d.count;if(d.close)l.close=d.close;const lead=d.lead!==false;leadPrev[no]=lead;
    if(asMax){ME.ceil={...(ME.ceil||{}),[no]:v};S.set("bidder",JSON.stringify(ME))}
    editing=null;render();term();$("lot-"+no).classList.add("flash");
    if(!lead)toast(w.maxLost(topBid(l)));
    say(no,!lead?w.maxLost(topBid(l)):asMax?w.maxSet(v)+(ST.online?"":" (preview)"):ST.online?w.fixed:w.fixedPreview,!lead);
    copy({lot:`Lot ${no} · ${txt(l,"part")}`,bid_eur:String(v)+(asMax?" (secret maximum)":""),name:ME.nick,country:ME.country,contact:ME.contact,age_21:"yes",rules:"yes",paddle:String(ME.num),kind:asMax?"maximum":"bid"})};
  if(!ST.online){const b=asMax?minBid(l):v;l.bids=[{num:ME.num,v:b,t:Date.now()},...l.bids];l.count++;return ok({bids:l.bids,count:l.count})}
  const ph=phase(l);if(ph!=="open"){editing=null;render();return say(no,ph==="pre"?w.opensOn:w.closed,1)}
  post("/api/bid",{lot:no,amount:v,ceiling:asMax?"yes":"",name:ME.nick,country:ME.country,contact:ME.contact,age_21:"yes",rules:"yes"}).then(ok).catch(e=>{editing=null;render();say(no,e.min?w.atLeast(e.min):e.message,1);poll()})}

/* ---------- terminal ---------- */
let seen=new Set(),first=true;
const pad=(s,n)=>String(s).padEnd(n," ");
function term(){const w=W(),ev=[];
  ST.regs.forEach(r=>ev.push({t:r.t,k:"r"+r.num+r.t,me:ME&&r.num===ME.num,h:`${pad("",8)}<b>#${r.num}</b>  ${w.gotNum}  ${hms(r.t)}`}));
  LOTS.forEach(l=>l.bids.forEach(b=>ev.push({t:b.t,k:"b"+l.no+b.num+b.v,me:ME&&b.num===ME.num,h:`<i>${pad(eur(b.v),8)}</i><b>#${b.num}</b>  ${w.lotW} ${l.no}  ${hms(b.t)}  ${esc(txt(l,"part").toLowerCase())}`})));
  ev.sort((a,b)=>a.t-b.t);const last=ev.slice(-40),ph=phase();
  const head=headTxt();
  $("ls").innerHTML=`<div class="l" id="head">${head}</div>`+last.map(e=>`<div class="l${e.me?" me":""}${!first&&!seen.has(e.k)?" new":""}">${e.h}</div>`).join("");
  last.forEach(e=>seen.add(e.k));first=false;const ls=$("ls");if($("term").classList.contains("big"))ls.scrollTop=ls.scrollHeight}
$("term").onclick=()=>{$("term").classList.toggle("big");term()};
function headTxt(){const w=W(),ph=phase();const h=ph==="pre"?w.headPre(left(ST.open-now())):ph==="open"?w.headOpen(left(Math.max(...LOTS.map(lotClose))-now())):w.headClosed;
  return ST.bidders>=10?`${h} · ${w.crowd(ST.bidders,ST.countries)}`:h}  // the crowd line only appears once it is worth showing
setInterval(()=>{const h=$("head");if(h)h.textContent=headTxt()},1000);

/* ---------- live ---------- */
function apply(d){ST.online=true;ST.skew=d.now-Date.now();ST.open=d.open;ST.close=d.close;ST.regs=d.regs||[];ST.bidders=d.bidders||0;ST.countries=d.countries||0;
  LOTS.forEach(l=>{const x=d.lots[l.no];if(!x)return;const was=leadPrev[l.no];l.bids=x.bids;l.count=x.count;l.close=x.close;l.bidders=x.bidders;
    const lead=!!(ME&&l.bids[0]&&l.bids[0].num===ME.num);
    if(was&&!lead&&l.bids[0]){toast(W().outbid(l.no,l.bids[0].v));document.title="(!) Skin Auction";}
    leadPrev[l.no]=lead});
  if(!editing)render();term()}
function poll(){if(document.hidden)return;fetch("/api/board",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{if(d&&d.lots)apply(d)}).catch(()=>{})}
(function loop(){setTimeout(()=>{poll();loop()},!ST.online||phase()==="open"?4000:30000)})();
document.addEventListener("visibilitychange",()=>{if(!document.hidden){document.title="Skin Auction";poll()}});

fetch("assets/lots.json",{cache:"no-cache"}).then(r=>r.json()).then(d=>{LOTS=d.map(l=>({...l,bids:[],count:0,close:null}))})
 .catch(()=>{LOTS=[]}).finally(()=>{door();render();term();poll()});
</script>
</body></html>
